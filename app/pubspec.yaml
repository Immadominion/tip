name: tip
description: A private, mobile-native wallet for Starknet.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.9.0

# starknet.dart is pinned to an exact commit rather than a branch. A mutable
# `ref: main` would let a dependency that signs transactions and handles key
# material change under us between builds, which is not a risk worth taking in
# a wallet. Bump this deliberately, and re-run the test suite when you do.
dependencies:
  flutter:
    sdk: flutter

  # Protocol client
  tip_privacy:
    path: ../packages/tip_privacy

  # Starknet account layer
  starknet:
    git:
      url: https://github.com/focustree/starknet.dart.git
      ref: 3f1720a8f7b1094993144ca2ba92e840b7f98d29
      path: packages/starknet
  starknet_provider:
    git:
      url: https://github.com/focustree/starknet.dart.git
      ref: 3f1720a8f7b1094993144ca2ba92e840b7f98d29
      path: packages/starknet_provider

  # Key material at rest
  flutter_secure_storage: ^11.0.0

  # Seed generation and derivation
  bip39: ^1.0.6

  google_fonts: ^6.3.3

  # QR encoding only. Pure Dart, no Flutter coupling, so the rendering stays
  # ours and matches the rest of the app rather than a package's defaults.
  qr: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

dependency_overrides:
  starknet:
    git:
      url: https://github.com/focustree/starknet.dart.git
      ref: 3f1720a8f7b1094993144ca2ba92e840b7f98d29
      path: packages/starknet
  starknet_provider:
    git:
      url: https://github.com/focustree/starknet.dart.git
      ref: 3f1720a8f7b1094993144ca2ba92e840b7f98d29
      path: packages/starknet_provider

flutter:
  uses-material-design: true
