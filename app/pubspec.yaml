name: tip
description: A private, mobile-native wallet for Starknet.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.12.0

# starknet.dart is pinned to an exact commit rather than a branch. A mutable
# `ref: main` would let a dependency that signs transactions and handles key
# material change under us between builds, which is not a risk worth taking in
# a wallet. Bump this deliberately, and re-run the test suite when you do.
dependencies:
  flutter:
    sdk: flutter

  # Protocol client
  tip_privacy:
    path: ../packages/tip_privacy

  # Starknet account layer
  starknet:
    git:
      url: https://github.com/focustree/starknet.dart.git
      ref: 3f1720a8f7b1094993144ca2ba92e840b7f98d29
      path: packages/starknet
  starknet_provider:
    git:
      url: https://github.com/focustree/starknet.dart.git
      ref: 3f1720a8f7b1094993144ca2ba92e840b7f98d29
      path: packages/starknet_provider

  # Key material at rest
  flutter_secure_storage: ^11.0.0

  # Seed generation and derivation
  bip39: ^1.0.6

  google_fonts: ^6.3.3

  # QR encoding only. Pure Dart, no Flutter coupling, so the rendering stays
  # ours and matches the rest of the app rather than a package's defaults.
  qr: ^4.0.0

  # Opening a block explorer. https only, so no scheme registration is needed
  # on either platform.
  url_launcher: ^6.3.2

  # The system share sheet. A tip link is meant to be handed to a person, and
  # copy-to-clipboard is a worse version of a thing every phone already does.
  share_plus: ^13.3.0

  # Receiving a tip link from outside the app. Handles both the https link and
  # the tip:// scheme, cold start and warm resume.
  app_links: ^7.2.1

  # Scanning a QR. The app already produces them for addresses and tip links,
  # and reading one is the difference between a tip working phone to phone and
  # needing a chat app in the middle.
  mobile_scanner: ^7.4.0

  # The screen lock. Face ID, fingerprint, or the device passcode.
  local_auth: ^3.0.2

  # Sign-in. Identity only; the wallet's keys never reach it.
  #
  # Held at 2.15 rather than the latest. 2.17 pulls realtime_client 2.13, which
  # wants web_socket_channel ^3, and the pinned starknet.dart wants ^2. Moving
  # the wallet's account layer to satisfy a login button is the wrong trade,
  # and nothing here uses realtime.
  supabase_flutter: ^2.15.2

  # Argon2id and AES-GCM for the encrypted backup. Already present through
  # tip_privacy; named here because this package depends on it directly.
  cryptography: ^2.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0

dependency_overrides:
  starknet:
    git:
      url: https://github.com/focustree/starknet.dart.git
      ref: 3f1720a8f7b1094993144ca2ba92e840b7f98d29
      path: packages/starknet
  starknet_provider:
    git:
      url: https://github.com/focustree/starknet.dart.git
      ref: 3f1720a8f7b1094993144ca2ba92e840b7f98d29
      path: packages/starknet_provider

flutter:
  uses-material-design: true
